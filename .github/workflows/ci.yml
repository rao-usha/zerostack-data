name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nexdata_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # App database: brought to alembic head before the tests run.
      DATABASE_URL: postgresql://test:test@localhost:5432/nexdata_test
      # Disposable database for the PG-backed spec tests (they drop and
      # recreate their own tables). Without this they all skip.
      TEST_PG_URL: postgresql://test:test@localhost:5432/nexdata_spec

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # must match the Dockerfile base image

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py311-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-py311-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Create spec-test database
        run: |
          python - <<'EOF'
          from sqlalchemy import create_engine, text
          engine = create_engine("postgresql://test:test@localhost:5432/nexdata_test",
                                 isolation_level="AUTOCOMMIT")
          with engine.connect() as conn:
              conn.execute(text("DROP DATABASE IF EXISTS nexdata_spec"))
              conn.execute(text("CREATE DATABASE nexdata_spec"))
          EOF

      - name: Migrate a blank database to alembic head
        # create_all + `alembic upgrade head`; fails CI if any migration fails
        run: python scripts/ci/bootstrap_db.py

      - name: Alembic model/migration drift (informational)
        # Known drift: indexes created by migrations 0009-0011 are not
        # declared on the models. Non-blocking until they are (SPEC_129).
        continue-on-error: true
        run: alembic check

      - name: Run tests with coverage
        run: |
          pytest tests/ --tb=short --ignore=tests/integration/ --cov=app --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  secrets:
    # Blocking. Scans only the commits this push / PR adds, so the known,
    # historical leaks (pending rotation, see .gitleaks.toml) cannot fail every build,
    # while any NEW secret does.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan new commits for secrets
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            RANGE="${BASE_SHA}..${HEAD_SHA}"
          else
            # new branch or rewritten history: scan the pushed tip commit
            RANGE="-1 ${HEAD_SHA}"
          fi
          echo "gitleaks range: $RANGE"
          gitleaks git --config .gitleaks.toml --redact --verbose --log-opts="$RANGE" .

  lint:
    runs-on: ubuntu-latest
    # Non-blocking for now until lint errors are fixed
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff linter
        run: ruff check app/ --output-format=github || true

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nexdata-api .

      - name: Smoke test the image
        # The app must import and build its routes inside the image. No DB is
        # needed for that; startup (lifespan) is what talks to Postgres.
        run: |
          docker run --rm -e DATABASE_URL=postgresql://nobody:x@127.0.0.1:1/none nexdata-api \
            python -c "import app.main as m; n = len(m.app.routes); assert n > 100, n; print('routes', n)"
          docker run --rm -e DATABASE_URL=postgresql://nobody:x@127.0.0.1:1/none nexdata-api \
            python -c "import app.worker.main; print('worker import ok')"
